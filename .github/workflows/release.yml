name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libfuse2 desktop-file-utils
      - run: packaging/appimage/build.sh
      - run: packaging/deb/build.sh
      - run: packaging/make-tarball.sh
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
  windows:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the exe files
        shell: pwsh
        run: packaging\windows\build.ps1
      - name: Smoke test
        shell: pwsh
        run: |
          dist\FreEvnia-windows\freevnia.exe --help
          $env:QT_QPA_PLATFORM = "offscreen"
          # a windowed exe does not block the shell: wait for it explicitly
          $p = Start-Process -FilePath "$PWD\dist\FreEvnia-windows\FreEvnia\FreEvnia.exe" -ArgumentList "--grab","$PWD\shot.png" -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          if (!(Test-Path "$PWD\shot.png")) { throw "the window did not start" }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/FreEvnia-windows-x64.zip
  macos:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the app
        run: packaging/macos/build.sh
      - name: Smoke test
        run: |
          dist/FreEvnia-macos/freevnia --help
          QT_QPA_PLATFORM=offscreen dist/FreEvnia-macos/FreEvnia.app/Contents/MacOS/FreEvnia --grab shot.png
          test -s shot.png
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/FreEvnia-macos-*.zip
