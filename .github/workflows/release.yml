name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libfuse2 desktop-file-utils
      - run: packaging/appimage/build.sh
      - run: packaging/deb/build.sh
      - run: packaging/make-tarball.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
